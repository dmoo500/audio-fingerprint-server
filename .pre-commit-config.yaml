repos:
  - repo: local
    hooks:
      - id: detect-private-key
        name: Detect private keys
        entry: scripts/run-in-env.sh detect-private-key
        language: system
        types: [text]
      - id: detect-secrets
        name: Detect credentials and tokens
        entry: "scripts/run-in-env.sh detect-secrets-hook --no-verify --baseline .secrets.baseline --exclude-lines '^integrity: \"sha512-[A-Za-z0-9+/]{86}==\"$'"
        language: system
        types: [text]
        exclude: ^\.secrets\.baseline$
      - id: check-ast
        name: Check Python syntax
        entry: scripts/run-in-env.sh check-ast
        language: system
        types: [python]
      - id: check-merge-conflict
        name: Check merge conflicts
        entry: scripts/run-in-env.sh check-merge-conflict
        language: system
        types: [text]
      - id: check-toml
        name: Check TOML
        entry: scripts/run-in-env.sh check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: Check YAML syntax (including Compose tags)
        entry: scripts/run-in-env.sh check-yaml --unsafe
        language: system
        types: [yaml]
      - id: check-json
        name: Check JSON
        entry: scripts/run-in-env.sh check-json
        language: system
        types: [json]
      - id: check-case-conflict
        name: Check filename case conflicts
        entry: scripts/run-in-env.sh check-case-conflict
        language: system
      - id: check-added-large-files
        name: Reject unexpectedly large files
        entry: scripts/run-in-env.sh check-added-large-files --maxkb=1024
        language: system
      - id: check-symlinks
        name: Check broken symlinks
        entry: scripts/run-in-env.sh check-symlinks
        language: system
        types: [symlink]
      - id: end-of-file-fixer
        name: Fix end of files
        entry: scripts/run-in-env.sh end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: Remove trailing whitespace
        entry: scripts/run-in-env.sh trailing-whitespace-fixer
        language: system
        types: [text]
      - id: ruff-check
        name: Ruff linter
        entry: scripts/run-in-env.sh ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: Ruff formatter
        entry: scripts/run-in-env.sh ruff format
        language: system
        types: [python]
        require_serial: true
      - id: documentation-links
        name: Check local documentation links
        entry: scripts/run-in-env.sh python scripts/check_docs.py
        language: system
        pass_filenames: false
        files: \.(md|html)$
