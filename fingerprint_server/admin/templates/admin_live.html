<script>
$(function () {
  const root = document.getElementById("admin-live");
  if (!root) return;
  const status = document.getElementById("live-status");
  const icon = document.getElementById("live-status-icon");
  const button = document.getElementById("live-reload");
  const dataset = root.dataset.dataset;
  let latestRevision = root.dataset.revision;
  let loadedRevision = latestRevision;
  let requestRevision = latestRevision;
  let lastSnapshot = Date.now();
  let expired = false;
  let tableFailed = false;
  const source = new EventSource(root.dataset.eventsUrl);
  const chart = document.getElementById("submission-chart");

  function updateChart(counts) {
    if (!chart) return;
    const colors = {
      processed: "#2f9e44", pending_metadata: "#f59f00", failed: "#d63939",
      queued: "#4263eb", processing: "#ae3ec9",
    };
    const entries = Object.entries(counts);
    const total = entries.reduce((sum, [, count]) => sum + count, 0);
    let position = 0;
    const segments = entries.filter(([, count]) => count > 0).map(([state, count]) => {
      const start = position;
      position += count / total * 100;
      return (colors[state] || "#868e96") + " " + start + "% " + position + "%";
    });
    chart.style.background = total ? "conic-gradient(" + segments.join(", ") + ")" : "#868e96";
    chart.setAttribute("aria-label", total
      ? "Submissions by status: " + entries.map(([state, count]) => state + ": " + count).join(", ")
      : "No submissions yet");
    document.getElementById("submission-chart-total").textContent = total.toLocaleString();
  }
  if (chart) updateChart(JSON.parse(chart.dataset.counts));

  function showStatus(message, state) {
    status.textContent = message;
    icon.dataset.state = state;
    icon.setAttribute("aria-label", message);
  }
  function updateButton() {
    if (!button) return;
    if (tableFailed) {
      button.disabled = false;
      button.textContent = "Retry table refresh";
      return;
    }
    const changed = latestRevision !== loadedRevision;
    button.disabled = !changed;
    button.textContent = changed ? "Newer data available - refresh" : "Table is up to date";
  }
  function setValue(name, value) {
    const node = document.querySelector('[data-live-value="' + name + '"]');
    if (node) node.textContent = value;
  }
  source.addEventListener("snapshot", function (event) {
    const snapshot = JSON.parse(event.data);
    lastSnapshot = Date.parse(snapshot.updated_at);
    if (Date.now() - lastSnapshot > 20000) {
      showStatus("Waiting for fresh data; displayed values may be outdated.", "error");
      return;
    }
    showStatus("Live updates connected - checked " + new Date(lastSnapshot).toLocaleTimeString(), "connected");
    if (tableFailed) {
      showStatus("Table refresh failed. Your previous rows may be outdated; retry refresh.", "error");
    }
    if (dataset) {
      latestRevision = snapshot.revisions[dataset];
      updateButton();
    } else {
      const overview = snapshot.overview;
      setValue("worker", overview.worker_available ? "Available" : "Unavailable");
      setValue("database", (overview.database_bytes / 1073741824).toFixed(2) + " GiB");
      setValue("published", overview.references.published + " published");
      setValue("stored", overview.references.stored + " stored");
      setValue("format", "Version " + overview.format_version);
      Object.entries(overview.submissions).forEach(function ([state, count]) {
        setValue(state, count);
      });
      updateChart(overview.submissions);
    }
  });
  source.addEventListener("unavailable", function () {
    showStatus("Live data check failed; displayed values may be outdated. Retrying...", "error");
  });
  source.addEventListener("session-expired", function () {
    expired = true;
    source.close();
    showStatus("Session ended. Sign in again to receive live updates.", "error");
  });
  source.onerror = function () {
    if (!expired) {
      showStatus("Live connection interrupted; displayed values may be outdated. Reconnecting...", "connecting");
    }
  };
  const watchdog = setInterval(function () {
    if (!expired && Date.now() - lastSnapshot > 20000) {
      showStatus("No fresh live data; displayed values may be outdated. Reconnecting...", "error");
    }
  }, 5000);
  window.addEventListener("pagehide", function () {
    clearInterval(watchdog);
    source.close();
  });
  window.addEventListener("pageshow", function (event) {
    if (event.persisted) window.location.reload();
  });

  if (!button) return;
  let scrollPosition = null;
  $("#dt").on("preXhr.dt", function () {
    requestRevision = latestRevision;
  }).on("draw.dt", function () {
    tableFailed = false;
    loadedRevision = requestRevision;
    updateButton();
    if (scrollPosition !== null) {
      $(".dataTables_scrollBody").scrollTop(scrollPosition);
      scrollPosition = null;
    }
  });
  $(document).on("ajaxError.adminLive", function (_event, _xhr, settings) {
    if (settings.url.split("?")[0] === model.apiUrl.split("?")[0]) {
      tableFailed = true;
      showStatus("Table refresh failed. Your previous rows may be outdated; retry refresh.", "error");
      updateButton();
    }
  });
  button.addEventListener("click", function () {
    const table = $("#dt").DataTable();
    scrollPosition = $(".dataTables_scrollBody").scrollTop();
    table.column(0).checkboxes.deselectAll();
    button.disabled = true;
    button.textContent = "Refreshing...";
    table.ajax.reload(null, false);
  });
});
</script>
