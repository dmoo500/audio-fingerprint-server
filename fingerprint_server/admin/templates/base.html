<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head_meta %}{% endblock %}
  {% block title %}<title>{{ title or app_title }}</title>{% endblock %}
  <link rel="stylesheet" href="{{ url_for(__name__ ~ ':statics', path='css/tabler.min-1.1.0.css') }}">
  <link rel="stylesheet" href="{{ url_for(__name__ ~ ':statics', path='css/fontawesome.min.css') }}">
  <style>
    :root { --tblr-font-sans-serif: system-ui, sans-serif; }
    .navbar-logo { width: auto; height: 2rem; }
    .submission-chart { position: relative; width: 15rem; max-width: 100%; aspect-ratio: 1;
      border-radius: 50%; background: var(--tblr-border-color, #ddd); flex-shrink: 0; }
    .submission-chart-center { position: absolute; inset: 23%; border-radius: 50%;
      background: var(--tblr-bg-surface, white); display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; }
    .submission-chart-center strong { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .submission-chart-center span { font-size: .75rem; }
    .submission-state-dot { display: inline-block; width: .75rem; height: .75rem;
      border-radius: 50%; margin-right: .5rem; }
    [data-submission-state="processed"] { background: #2f9e44; }
    [data-submission-state="pending_metadata"] { background: #f59f00; }
    [data-submission-state="failed"] { background: #d63939; }
    [data-submission-state="queued"] { background: #4263eb; }
    [data-submission-state="processing"] { background: #ae3ec9; }
    .admin-live-status { float: right; position: relative; margin-left: 1rem; z-index: 10; }
    .admin-live-status summary {
      display: flex; align-items: center; justify-content: center;
      width: 1.75rem; height: 1.75rem; border: 2px solid currentColor;
      border-radius: 50%; font-weight: 700; cursor: pointer; list-style: none;
    }
    .admin-live-status summary::-webkit-details-marker { display: none; }
    .admin-live-status summary[data-state="connecting"] { color: #966300; background: #fff4cf; }
    .admin-live-status summary[data-state="connected"] { color: #24733b; background: #e5f5e9; }
    .admin-live-status summary[data-state="error"] { color: #b4232c; background: #ffe8e9; }
    .admin-live-status summary:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    .admin-live-status .admin-live-tooltip {
      display: none; position: absolute; right: 0; top: 100%; padding: .75rem 1rem;
      width: min(20rem, 80vw); background: var(--tblr-bg-surface, white);
      color: var(--tblr-body-color, #222); border: 1px solid var(--tblr-border-color, #ddd);
      border-radius: .5rem; box-shadow: 0 .25rem 1rem #0002; font-size: .875rem;
    }
    .admin-live-status details[open] ~ .admin-live-tooltip,
    .admin-live-status:hover .admin-live-tooltip,
    .admin-live-status:focus-within .admin-live-tooltip { display: block; }
  </style>
  {% block head_css %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% block modal %}{% endblock %}
  <script src="{{ url_for(__name__ ~ ':statics', path='js/vendor/jquery.min.js') }}"></script>
  <script src="{{ url_for(__name__ ~ ':statics', path='js/vendor/js.cookie.min.js') }}"></script>
  <script src="{{ url_for(__name__ ~ ':statics', path='js/vendor/tabler.min-1.1.0.js') }}"></script>
  {% block script %}{% endblock %}
</body>
</html>
