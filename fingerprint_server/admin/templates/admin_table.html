<script>
$(function () {
  const table = $("#dt").DataTable();
  const input = $("#searchInput");
  const status = document.getElementById("table-query-status");
  const root = document.getElementById("dt");
  let searchTimer;
  function loading(message) {
    status.textContent = message;
    status.className = "mt-2 text-primary";
    root.setAttribute("aria-busy", "true");
  }
  $("#dt").on("preXhr.dt", function () {
    loading(table.search() ? "Searching all records... Previous rows remain until results arrive."
      : "Loading table... Previous rows remain until results arrive.");
  }).on("draw.dt", function () {
    const info = table.page.info();
    status.textContent = table.search()
      ? info.recordsDisplay + " matching records."
      : info.recordsDisplay + " records.";
    status.className = "mt-2 text-secondary";
    root.setAttribute("aria-busy", "false");
  });
  $(document).on("ajaxError.adminTable", function (_event, _xhr, settings) {
    if (settings.url.split("?")[0] !== model.apiUrl.split("?")[0]) return;
    status.textContent = "Table request failed. Previous rows are not current results. Retry refresh.";
    status.className = "mt-2 text-danger";
    root.setAttribute("aria-busy", "false");
  });
  input.attr("maxlength", "200");
  input.off("keyup").on("input", function () {
    clearTimeout(searchTimer);
    const value = this.value;
    loading("Preparing search...");
    searchTimer = setTimeout(function () {
      if (value !== table.search()) table.search(value).draw();
    }, 350);
  }).on("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      clearTimeout(searchTimer);
      if (this.value !== table.search()) table.search(this.value).draw();
    }
  });
  window.addEventListener("pagehide", function () { clearTimeout(searchTimer); });
});
</script>
