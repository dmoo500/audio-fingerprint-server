<div class="admin-live-status">
  <details>
  <summary id="live-status-icon" data-state="{{ 'error' if live_failed else 'connecting' }}"
           aria-label="Live update status" aria-describedby="live-status">?</summary>
  </details>
  <div id="live-status" role="status" class="admin-live-tooltip">
    {% if live_failed %}Live data check failed; displayed values may be outdated.
    {% else %}Connecting to live updates...{% endif %}
  </div>
</div>
