name: Publish API reference

on:
  push:
    branches: [main]
    paths:
      - openapi.json
      - docs/reference/**
      - .github/workflows/api-docs.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Assemble self-contained reference
        run: |
          mkdir -p _site
          cp docs/reference/index.html docs/reference/reference.js docs/reference/reference.css _site/
          cp openapi.json _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy API reference
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
