name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint:check
      - run: corepack pnpm install --frozen-lockfile
        working-directory: recognition-frontend
      - run: corepack pnpm build && corepack pnpm test
        working-directory: recognition-frontend
      - run: node --test tests/test_recording.js
      - run: corepack pnpm install --frozen-lockfile
        working-directory: admin-frontend
      - run: corepack pnpm build && corepack pnpm test
        working-directory: admin-frontend
      - run: python -m pip install uv
      - run: uv venv && uv pip install -e '.[dev,admin]'
      - run: uv run --no-sync pre-commit run --all-files
      - run: uv run --no-sync mypy fingerprint_server
      - run: uv run --no-sync pytest -q tests/test_precommit_safeguards.py tests/test_repository_layout.py tests/test_admin.py tests/test_admin_live.py tests/test_sqlite_admin.py tests/test_recognition.py tests/test_recognition_accounts.py tests/test_database_growth.py
