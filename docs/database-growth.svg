<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title description">
  <title id="title">Example of SQLite database growth</title>
  <desc id="description">SQLite schema 7 snapshots 1, 2 and 3: occupied space increased from 1,418.54 to 1,687.23 to 2,111.26 MiB, published references from 460 to 555 to 715, and stored landmarks from 38,637,618 to 45,496,656 to 56,424,148. Each measurement has its own vertical scale.</desc>
  <rect width="1100" height="420" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#222222">
    <text x="550" y="30" font-size="21" font-weight="bold" text-anchor="middle">Example of SQLite database growth</text>
    <text x="550" y="53" font-size="14" text-anchor="middle">Schema 7; each series uses its own vertical scale</text>
    <g font-size="13" font-weight="bold" text-anchor="middle">
      <text x="55" y="90" fill="#1769aa">MiB</text>
      <text x="135" y="90" fill="#1b6d38">References</text>
      <text x="230" y="90" fill="#b65c00">Landmarks</text>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="55" y="114" fill="#1769aa">2,500</text>
      <text x="55" y="224" fill="#1769aa">1,250</text>
      <text x="55" y="334" fill="#1769aa">0</text>
      <text x="135" y="114" fill="#1b6d38">1,000</text>
      <text x="135" y="224" fill="#1b6d38">500</text>
      <text x="135" y="334" fill="#1b6d38">0</text>
      <text x="230" y="114" fill="#b65c00">75,000,000</text>
      <text x="230" y="224" fill="#b65c00">37,500,000</text>
      <text x="230" y="334" fill="#b65c00">0</text>
    </g>
    <g font-size="14" text-anchor="middle">
      <text x="350" y="355">1</text>
      <text x="500" y="355">2</text>
      <text x="650" y="355">3</text>
      <text x="500" y="385">Snapshot</text>
    </g>
  </g>
  <g stroke="#dddddd" stroke-width="1">
    <path d="M290 110H670 M290 220H670 M290 330H670"/>
  </g>
  <path d="M290 110V330H670" fill="none" stroke="#555555"/>
  <g fill="none" stroke-width="3">
    <path d="M350 205.17L500 181.52L650 144.21" stroke="#1769aa"/>
    <path d="M350 228.80L500 207.90L650 172.70" stroke="#1b6d38"/>
    <path d="M350 216.66L500 196.54L650 164.49" stroke="#b65c00"/>
  </g>
  <g stroke-width="2">
    <g fill="#1769aa" stroke="#ffffff">
      <circle cx="350" cy="205.17" r="4"/><circle cx="500" cy="181.52" r="4"/><circle cx="650" cy="144.21" r="4"/>
    </g>
    <g fill="#1b6d38" stroke="#ffffff">
      <circle cx="350" cy="228.80" r="4"/><circle cx="500" cy="207.90" r="4"/><circle cx="650" cy="172.70" r="4"/>
    </g>
    <g fill="#b65c00" stroke="#ffffff">
      <circle cx="350" cy="216.66" r="4"/><circle cx="500" cy="196.54" r="4"/><circle cx="650" cy="164.49" r="4"/>
    </g>
  </g>
  <g font-family="sans-serif" font-size="14">
    <path d="M710 84H740" stroke="#1769aa" stroke-width="3"/>
    <text x="750" y="89" fill="#1769aa" font-weight="bold">Occupied space</text>
    <text x="750" y="110" fill="#222222">1: 1,418.54 MiB</text>
    <text x="750" y="130" fill="#222222">2: 1,687.23 MiB</text>
    <text x="750" y="150" fill="#222222">3: 2,111.26 MiB</text>
    <path d="M710 179H740" stroke="#1b6d38" stroke-width="3"/>
    <text x="750" y="184" fill="#1b6d38" font-weight="bold">Published references</text>
    <text x="750" y="205" fill="#222222">1: 460</text>
    <text x="750" y="225" fill="#222222">2: 555</text>
    <text x="750" y="245" fill="#222222">3: 715</text>
    <path d="M710 274H740" stroke="#b65c00" stroke-width="3"/>
    <text x="750" y="279" fill="#b65c00" font-weight="bold">Stored landmarks</text>
    <text x="750" y="300" fill="#222222">1: 38,637,618</text>
    <text x="750" y="320" fill="#222222">2: 45,496,656</text>
    <text x="750" y="340" fill="#222222">3: 56,424,148</text>
  </g>
</svg>
